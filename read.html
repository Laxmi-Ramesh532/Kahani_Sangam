<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>कहानी पढ़ें</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f8f5ef;
  color:#29231e;
  font-family:Georgia,"Noto Serif Devanagari",serif;
}

.container{
  width:94%;
  max-width:900px;
  margin:20px auto 50px;
}

/* ================= STORY HOME ================= */

.story-box{
  background:#fffdf9;
  border:1px solid #d8cfc2;
  border-radius:18px;
  padding:22px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.story-top{
  display:flex;
  gap:22px;
  align-items:flex-start;
}

/* COVER */

.cover-box{
  width:150px;
  min-width:150px;
  height:190px;
  border:1px solid #d6cbbb;
  border-radius:12px;
  overflow:hidden;
  background:#f0ebe3;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cover-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-cover{
  text-align:center;
  color:#8b8176;
  font-size:14px;
  padding:10px;
}

/* AUTHOR */

.author-box{
  flex:1;
  min-height:190px;
  border:1px solid #e0d8cd;
  border-radius:12px;
  padding:20px;
  background:#faf7f2;
  display:flex;
  align-items:center;
}

.author-profile{
  cursor:pointer;
}

.author-circle{
  width:72px;
  height:72px;
  border-radius:50%;
  background:#e5ddd1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  margin-bottom:10px;
}

.author-name{
  font-size:20px;
  font-weight:bold;
}

.author-hint{
  margin-top:6px;
  font-size:13px;
  color:#82776b;
}

/* TITLE */

.story-title{
  font-size:30px;
  text-align:center;
  margin:25px 0 18px;
  line-height:1.5;
}

/* INFO */

.story-info{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #ddd4c8;
  padding-top:15px;
  color:#675d53;
  font-size:15px;
}

.info-item{
  text-align:center;
  flex:1;
}

/* STORY RATING */

.story-rating{
  margin-top:20px;
  padding:18px;
  border:1px solid #ddd4c8;
  border-radius:12px;
  text-align:center;
  background:#fff;
}

.rating-title{
  font-weight:bold;
  margin-bottom:10px;
}

.stars{
  display:flex;
  justify-content:center;
  gap:7px;
  margin:8px 0;
}

.star{
  font-size:30px;
  cursor:pointer;
  color:#b8aea3;
}

.star.selected{
  color:#d79b25;
}

.rating-button{
  border:none;
  background:#59483a;
  color:white;
  padding:9px 20px;
  border-radius:20px;
  cursor:pointer;
}

.rating-message{
  margin-top:9px;
  font-size:14px;
}

/* ================= EPISODES ================= */

.episodes-heading{
  margin:30px 0 15px;
  font-size:24px;
}

.episode-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.episode-card{
  background:#fffdf9;
  border:1px solid #d8cfc2;
  border-radius:13px;
  padding:17px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:14px;
  transition:.2s;
}

.episode-card:hover{
  transform:translateY(-1px);
}

.episode-number{
  font-weight:bold;
  white-space:nowrap;
}

.episode-title{
  flex:1;
  font-size:18px;
}

.read-episode{
  border:none;
  background:#59483a;
  color:white;
  padding:7px 14px;
  border-radius:18px;
  cursor:pointer;
}

/* ================= EPISODE PAGE ================= */

.episode-page{
  display:none;
}

.back-button{
  border:none;
  background:#59483a;
  color:#fff;
  padding:9px 17px;
  border-radius:20px;
  cursor:pointer;
  margin-bottom:18px;
}

.episode-box{
  background:#fffdf9;
  border:1px solid #d8cfc2;
  border-radius:18px;
  padding:28px;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.episode-number-large{
  text-align:center;
  font-size:17px;
  color:#81766b;
}

.episode-title-large{
  text-align:center;
  font-size:30px;
  line-height:1.5;
  margin:10px 0 25px;
}

.episode-content{
  font-size:20px;
  line-height:2;
  white-space:pre-wrap;
}

/* EPISODE REVIEW */

.episode-review{
  margin-top:35px;
  border-top:1px solid #ddd4c8;
  padding-top:20px;
}

.review-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px;
}

.review-stars{
  display:flex;
  gap:6px;
}

.review-star{
  font-size:28px;
  cursor:pointer;
  color:#b8aea3;
}

.review-star.selected{
  color:#d79b25;
}

textarea{
  width:100%;
  min-height:90px;
  margin-top:12px;
  padding:12px;
  border:1px solid #d3c9bd;
  border-radius:10px;
  font-family:inherit;
  font-size:16px;
  resize:vertical;
}

.review-button{
  margin-top:10px;
  border:none;
  background:#59483a;
  color:white;
  padding:9px 20px;
  border-radius:20px;
  cursor:pointer;
}

.review-message{
  margin-top:9px;
  font-size:14px;
}

@media(max-width:600px){

  .container{
    width:95%;
    margin-top:12px;
  }

  .story-box{
    padding:15px;
  }

  .story-top{
    gap:12px;
  }

  .cover-box{
    width:115px;
    min-width:115px;
    height:150px;
  }

  .author-box{
    min-height:150px;
    padding:12px;
  }

  .author-circle{
    width:55px;
    height:55px;
    font-size:24px;
  }

  .author-name{
    font-size:17px;
  }

  .story-title{
    font-size:25px;
  }

  .story-info{
    font-size:13px;
  }

  .episode-card{
    padding:13px;
  }

  .episode-number{
    font-size:14px;
  }

  .episode-title{
    font-size:16px;
  }

  .read-episode{
    padding:6px 10px;
    font-size:12px;
  }

  .episode-box{
    padding:18px;
  }

  .episode-title-large{
    font-size:25px;
  }

  .episode-content{
    font-size:20px;
    line-height:2;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- ================= STORY HOME ================= -->

  <div id="story-home">

    <div class="story-box">

      <div class="story-top">

        <div class="cover-box" id="coverBox">
          <div class="no-cover">
            इस कहानी का<br>
            Cover उपलब्ध नहीं है
          </div>
        </div>

        <div class="author-box">

          <div
            class="author-profile"
            id="authorProfile"
            onclick="openAuthorStories()"
          >

            <div class="author-circle">✍️</div>

            <div
              class="author-name"
              id="authorName"
            >
              लेखक
            </div>

            <div class="author-hint">
              लेखक की अन्य कहानियाँ देखें
            </div>

          </div>

        </div>

      </div>

      <div
        class="story-title"
        id="storyTitle"
      >
        कहानी
      </div>

      <div class="story-info">

        <div class="info-item">
          ⭐ <span id="ratingCount">0</span><br>
          रेटिंग
        </div>

        <div class="info-item">
          👁 <span id="readCount">0</span><br>
          पाठक
        </div>

      </div>

      <!-- STORY RATING -->

      <div class="story-rating">

        <div class="rating-title">
          इस कहानी को रेट करें
        </div>

        <div
          class="stars"
          id="storyStars"
        ></div>

        <button
          class="rating-button"
          onclick="saveStoryRating()"
        >
          Rating Save करें
        </button>

        <div
          class="rating-message"
          id="story-rating-message"
        ></div>

      </div>

    </div>

    <div class="episodes-heading">
      Episodes
    </div>

    <div
      class="episode-list"
      id="episodes"
    >
      Episodes लोड हो रहे हैं...
    </div>

  </div>


  <!-- ================= EPISODE PAGE ================= -->

  <div
    class="episode-page"
    id="episode-page"
  >

    <button
      class="back-button"
      onclick="backToStory()"
    >
      ← कहानी पर वापस जाएँ
    </button>

    <div class="episode-box">

      <div
        class="episode-number-large"
        id="episode-number"
      ></div>

      <div
        class="episode-title-large"
        id="episode-title"
      ></div>

      <div
        class="episode-content"
        id="episode-content"
      ></div>


      <!-- EPISODE REVIEW -->

      <div class="episode-review">

        <div class="review-title">
          इस Episode को रेट करें और Review दें
        </div>

        <div
          class="review-stars"
          id="episodeStars"
        ></div>

        <textarea
          id="episodeReview"
          placeholder="अपने विचार लिखें..."
        ></textarea>

        <button
          class="review-button"
          onclick="saveEpisodeReview()"
        >
          Review Save करें
        </button>

        <div
          class="review-message"
          id="episode-review-message"
        ></div>

      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://wnvkryudbeafebaluwgq.supabase.co";

/*
  यहाँ अपनी वही working Publishable Key लगाओ
  जो तुम्हारी बाकी working pages में लगी है।
*/

const SUPABASE_KEY =
  "अपनी-working-Publishable-Key-यहाँ-लगाएँ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   VARIABLES
   ========================================================= */

const params =
  new URLSearchParams(window.location.search);

const storyId =
  params.get("id");

const episodeFromURL =
  params.get("episode");

let currentEpisodeId =
  episodeFromURL || null;

let selectedStoryRating =
  0;

let selectedEpisodeRating =
  0;


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;
}


/* =========================================================
   LOAD STORY
   ========================================================= */

async function loadStory(){

  if(!storyId){

    document.getElementById(
      "story-home"
    ).innerHTML =
      "<p>कहानी नहीं मिली।</p>";

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("Story")
      .select("*")
      .eq("id", storyId)
      .single();


  if(error){

    console.log(error);

    document.getElementById(
      "story-home"
    ).innerHTML =
      "<p>कहानी लोड नहीं हो सकी।</p>";

    return;
  }


  /* STORY TITLE */

  document.getElementById(
    "storyTitle"
  ).textContent =
    data.title || "बिना शीर्षक";


  /* AUTHOR */

  document.getElementById(
    "authorName"
  ).textContent =
    data.author_name || "अज्ञात लेखक";


  /* RATING COUNT */

  document.getElementById(
    "ratingCount"
  ).textContent =
    data.rating_count || 0;


  /* READ COUNT */

  document.getElementById(
    "readCount"
  ).textContent =
    data.read_count || 0;


  /* COVER */

  const coverBox =
    document.getElementById("coverBox");

  const cover =
    data.cover_image ||
    data.image_url;

  if(cover){

    coverBox.innerHTML =
      `<img
        src="${escapeHTML(cover)}"
        alt="Story Cover"
      >`;
  }


  /* READ COUNT */

  const {
    error: readError
  } =
    await supabaseClient.rpc(
      "increment_story_read_count",
      {
        story_id_input: storyId
      }
    );

  if(readError){

    console.log(
      "Read count error:",
      readError
    );

  }else{

    document.getElementById(
      "readCount"
    ).textContent =
      Number(data.read_count || 0) + 1;
  }


  /* STORY RATING STARS */

  createStoryStars();


  /* EPISODES */

  await loadEpisodes();


  /* URL में Episode हो तो खोलें */

  if(episodeFromURL){

    await openEpisode(
      episodeFromURL,
      false
    );
  }

}


/* =========================================================
   LOAD EPISODES
   ========================================================= */

async function loadEpisodes(){

  const episodeBox =
    document.getElementById("episodes");


  const {
    data,
    error
  } =
    await supabaseClient
      .from("Episodes")
      .select(
        "id, episode_number, episode_title"
      )
      .eq(
        "story_id",
        storyId
      )
      .order(
        "episode_number",
        {
          ascending:true
        }
      );


  if(error){

    console.log(
      "Episodes error:",
      error
    );

    episodeBox.innerHTML =
      "Episodes लोड नहीं हो सके।<br><small>" +
      escapeHTML(error.message) +
      "</small>";

    return;
  }


  if(!data || data.length === 0){

    episodeBox.innerHTML =
      `<div style="
        text-align:center;
        padding:25px;
        color:#776d63;
      ">
        इस कहानी में अभी कोई Episode प्रकाशित नहीं हुआ है।
      </div>`;

    return;
  }


  episodeBox.innerHTML = "";


  data.forEach(
    episode => {

      const card =
        document.createElement("div");

      card.className =
        "episode-card";


      card.onclick =
        function(){

          openEpisode(
            episode.id
          );

        };


      const number =
        document.createElement("span");

      number.className =
        "episode-number";

      number.textContent =
        "Episode " +
        episode.episode_number;


      const title =
        document.createElement("span");

      title.className =
        "episode-title";

      title.textContent =
        episode.episode_title ||
        "बिना शीर्षक";


      const button =
        document.createElement("button");

      button.className =
        "read-episode";

      button.textContent =
        "पढ़ें";


      button.onclick =
        function(event){

          event.stopPropagation();

          openEpisode(
            episode.id
          );

        };


      card.appendChild(number);
      card.appendChild(title);
      card.appendChild(button);

      episodeBox.appendChild(card);

    }
  );

}


/* =========================================================
   OPEN EPISODE
   ========================================================= */

async function openEpisode(
  episodeId,
  changeURL = true
){

  currentEpisodeId =
    episodeId;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("Episodes")
      .select(
        "id, story_id, episode_number, episode_title, content"
      )
      .eq(
        "id",
        episodeId
      )
      .maybeSingle();


  if(error){

    console.log(
      "Episode error:",
      error
    );

    alert(
      "Episode error: " +
      error.message
    );

    return;
  }


  if(!data){

    alert(
      "यह Episode database में नहीं मिला।"
    );

    return;
  }


  if(
    String(data.story_id) !==
    String(storyId)
  ){

    alert(
      "यह Episode इस कहानी का हिस्सा नहीं है।"
    );

    return;
  }


  document.getElementById(
    "episode-number"
  ).textContent =
    "Episode " +
    data.episode_number;


  document.getElementById(
    "episode-title"
  ).textContent =
    data.episode_title ||
    "बिना शीर्षक";


  document.getElementById(
    "episode-content"
  ).innerHTML =
    data.content || "";


  document.getElementById(
    "story-home"
  ).style.display =
    "none";


  document.getElementById(
    "episode-page"
  ).style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  if(changeURL){

    const newURL =
      "read.html?id=" +
      encodeURIComponent(storyId) +
      "&episode=" +
      encodeURIComponent(episodeId);

    window.history.pushState(
      {},
      "",
      newURL
    );

  }


  createEpisodeStars();

  await loadMyEpisodeReview();

}


/* =========================================================
   BACK TO STORY
   ========================================================= */

function backToStory(){

  document.getElementById(
    "episode-page"
  ).style.display =
    "none";


  document.getElementById(
    "story-home"
  ).style.display =
    "block";


  const newURL =
    "read.html?id=" +
    encodeURIComponent(storyId);

  window.history.pushState(
    {},
    "",
    newURL
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   STORY STARS
   ========================================================= */

function createStoryStars(){

  const box =
    document.getElementById(
      "storyStars"
    );

  box.innerHTML = "";

  for(
    let i = 1;
    i <= 5;
    i++
  ){

    const star =
      document.createElement("span");

    star.className =
      "star";

    star.textContent =
      "★";

    star.onclick =
      function(){

        selectedStoryRating =
          i;

        updateStoryStars();

      };

    box.appendChild(star);

  }

}


function updateStoryStars(){

  const stars =
    document.querySelectorAll(
      "#storyStars .star"
    );

  stars.forEach(
    (star,index) => {

      star.classList.toggle(
        "selected",
        index + 1 <=
        selectedStoryRating
      );

    }
  );

}


/* =========================================================
   SAVE STORY RATING
   ========================================================= */

async function saveStoryRating(){

  const message =
    document.getElementById(
      "story-rating-message"
    );


  if(!selectedStoryRating){

    message.textContent =
      "पहले Rating चुनें।";

    return;
  }


  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if(
    userError ||
    !user
  ){

    message.textContent =
      "Rating देने के लिए पहले Login करें।";

    return;
  }


  /* पहले देखें कि इस user ने rating दी है या नहीं */

  const {
    data: oldRating,
    error: oldError
  } =
    await supabaseClient
      .from("Story_Ratings")
      .select("id")
      .eq(
        "story_id",
        storyId
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(oldError){

    console.log(oldError);

    message.textContent =
      "Rating error: " +
      oldError.message;

    return;
  }


  let error;


  if(oldRating){

    /*
      पहले से rating है,
      इसलिए UPDATE
    */

    ({
      error
    } =
      await supabaseClient
        .from("Story_Ratings")
        .update({
          rating:
            selectedStoryRating
        })
        .eq(
          "id",
          oldRating.id
        ));

  }else{

    /*
      नई rating
    */

    ({
      error
    } =
      await supabaseClient
        .from("Story_Ratings")
        .insert({
          story_id:
            storyId,

          user_id:
            user.id,

          rating:
            selectedStoryRating
        }));

  }


  if(error){

    console.log(error);

    message.textContent =
      "Rating error: " +
      error.message;

    return;
  }


  message.textContent =
    "रेटिंग सेव हो गई।";

}


/* =========================================================
   EPISODE STARS
   ========================================================= */

function createEpisodeStars(){

  const box =
    document.getElementById(
      "episodeStars"
    );

  box.innerHTML = "";

  selectedEpisodeRating = 0;


  for(
    let i = 1;
    i <= 5;
    i++
  ){

    const star =
      document.createElement("span");

    star.className =
      "review-star";

    star.textContent =
      "★";

    star.onclick =
      function(){

        selectedEpisodeRating =
          i;

        updateEpisodeStars();

      };

    box.appendChild(star);

  }

}


function updateEpisodeStars(){

  const stars =
    document.querySelectorAll(
      "#episodeStars .review-star"
    );

  stars.forEach(
    (star,index) => {

      star.classList.toggle(
        "selected",
        index + 1 <=
        selectedEpisodeRating
      );

    }
  );

}


/* =========================================================
   LOAD MY EPISODE REVIEW
   ========================================================= */

async function loadMyEpisodeReview(){

  document.getElementById(
    "episodeReview"
  ).value = "";

  document.getElementById(
    "episode-review-message"
  ).textContent = "";


  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("Feedback")
      .select(
        "rating, feedback"
      )
      .eq(
        "episode_id",
        currentEpisodeId
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(error){

    console.log(
      "Review load error:",
      error
    );

    return;
  }


  if(data){

    selectedEpisodeRating =
      data.rating || 0;

    document.getElementById(
      "episodeReview"
    ).value =
      data.feedback || "";

    updateEpisodeStars();

  }

}


/* =========================================================
   SAVE EPISODE REVIEW
   ========================================================= */

async function saveEpisodeReview(){

  const message =
    document.getElementById(
      "episode-review-message"
    );


  if(!selectedEpisodeRating){

    message.textContent =
      "पहले Rating चुनें।";

    return;
  }


  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if(
    userError ||
    !user
  ){

    message.textContent =
      "Review देने के लिए पहले Login करें।";

    return;
  }


  const feedback =
    document.getElementById(
      "episodeReview"
    ).value.trim();


  const {
    data: existing,
    error: findError
  } =
    await supabaseClient
      .from("Feedback")
      .select("id")
      .eq(
        "episode_id",
        currentEpisodeId
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(findError){

    message.textContent =
      "Review error: " +
      findError.message;

    return;
  }


  let error;


  if(existing){

    ({
      error
    } =
      await supabaseClient
        .from("Feedback")
        .update({

          rating:
            selectedEpisodeRating,

          feedback:
            feedback

        })
        .eq(
          "id",
          existing.id
        ));

  }else{

    ({
      error
    } =
      await supabaseClient
        .from("Feedback")
        .insert({

          episode_id:
            currentEpisodeId,

          user_id:
            user.id,

          rating:
            selectedEpisodeRating,

          feedback:
            feedback

        }));

  }


  if(error){

    console.log(error);

    message.textContent =
      "Review error: " +
      error.message;

    return;
  }


  message.textContent =
    "Review सेव हो गया।";

}


/* =========================================================

async function openAuthorStories(){

  const author =
    document.getElementById(
      "authorName"
    ).textContent.trim();


  /*
    अभी लेखक profile पर click करने पर
    उसके stories वाले page पर भेजने के लिए
    यह URL बनाया गया है।
    
    बाद में हम इसके लिए अलग author.html
    बना सकते हैं।
  */

  window.location.href =
    "index.html?author=" +
    encodeURIComponent(author);

}
