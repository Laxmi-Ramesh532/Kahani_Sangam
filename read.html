<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>कहानी संसार</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f1e7;
  color:#4b3828;
  font-family:Georgia,"Noto Serif Devanagari",serif;
}

header{
  background:#fffaf2;
  border-bottom:1px solid #d8c8b4;
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.search-btn{
  border:1px solid #cdbba5;
  background:#f7f1e7;
  border-radius:20px;
  padding:7px 13px;
  color:#5b4430;
}

.container{
  width:min(900px,94%);
  margin:20px auto 80px;
}

/* STORY HEADER */

.story-box{
  background:#fffdf8;
  border:1px solid #d8c8b4;
  border-radius:18px;
  padding:18px;
  box-shadow:0 3px 12px rgba(80,50,20,.07);
}

.story-top{
  display:flex;
  gap:18px;
  align-items:flex-start;
}

.cover-box{
  width:105px;
  height:145px;
  border:1px solid #d6c2a9;
  border-radius:10px;
  overflow:hidden;
  background:#eee4d5;
  flex-shrink:0;
}

.cover-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-cover{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:13px;
  color:#8a7660;
  padding:10px;
}

.story-info{
  flex:1;
}

.story-title{
  font-size:28px;
  margin:0 0 10px;
  line-height:1.35;
}

.author{
  color:#765b42;
  cursor:pointer;
  font-size:16px;
}

.description{
  margin-top:12px;
  font-size:15px;
  line-height:1.7;
  color:#654e3a;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  margin-top:15px;
  font-size:14px;
  color:#705a45;
}

/* STORY RATING */

.rating-area{
  margin-top:18px;
  padding-top:15px;
  border-top:1px solid #eadfce;
}

.rating-title{
  font-weight:bold;
  margin-bottom:8px;
}

.stars{
  display:flex;
  gap:5px;
}

.star{
  border:0;
  background:none;
  font-size:28px;
  cursor:pointer;
  color:#c6b6a2;
  padding:0;
}

.star.active{
  color:#c48a31;
}

/* DONATION */

.encourage-box{
  margin-top:18px;
  border:1px solid #dfcdb5;
  background:#faf3e8;
  border-radius:13px;
  padding:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.encourage-box span{
  font-size:14px;
}

.encourage-btn{
  border:1px solid #b99974;
  background:#fffaf2;
  border-radius:20px;
  padding:8px 14px;
  cursor:pointer;
  color:#5c432d;
}

/* EPISODES */

.section-title{
  font-size:22px;
  margin:28px 3px 13px;
}

.new-episode-btn{
  width:100%;
  border:1px dashed #b89e7d;
  background:#fffaf2;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  color:#694c32;
  cursor:pointer;
  margin-bottom:14px;
}

.new-episode-btn:hover{
  background:#f3e8d8;
}

.episode-card{
  background:#fffdf9;
  border:1px solid #d9c9b7;
  border-radius:15px;
  margin-bottom:15px;
  overflow:hidden;
}

.episode-head{
  padding:15px 16px 9px;
  cursor:pointer;
}

.episode-number{
  font-size:13px;
  color:#9a7857;
  margin-bottom:5px;
}

.episode-title{
  font-size:20px;
  margin:0;
  line-height:1.4;
}

.episode-meta{
  font-size:13px;
  color:#8b7764;
  margin-top:7px;
}

.episode-actions{
  padding:0 16px 12px;
  display:flex;
  gap:8px;
}

.small-btn{
  border:1px solid #d2c0a9;
  background:#f9f2e7;
  border-radius:16px;
  padding:5px 11px;
  cursor:pointer;
  color:#654a34;
}

.delete-btn{
  color:#8b3c32;
}

/* EPISODE CONTENT */

.episode-content{
  display:none;
  padding:18px 16px;
  border-top:1px solid #eadfce;
  font-size:17px;
  line-height:1.9;
}

.episode-content.open{
  display:block;
}

.episode-content img{
  max-width:100%;
  height:auto;
  border-radius:8px;
}

.episode-content p{
  margin:0 0 15px;
}

/* REVIEW */

.review-box{
  margin-top:20px;
  padding:15px;
  background:#faf5ed;
  border-top:1px solid #e3d5c3;
}

.review-title{
  font-weight:bold;
  margin-bottom:7px;
}

.review-text{
  width:100%;
  min-height:80px;
  resize:vertical;
  border:1px solid #d4c1aa;
  border-radius:9px;
  padding:10px;
  background:#fffdf9;
  font-family:inherit;
  font-size:15px;
}

.review-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
  gap:8px;
}

.review-stars{
  display:flex;
  gap:2px;
}

.review-star{
  border:0;
  background:none;
  font-size:22px;
  color:#c9b8a4;
  cursor:pointer;
  padding:0;
}

.review-star.active{
  color:#c48a31;
}

.submit-review{
  border:0;
  background:#745337;
  color:white;
  padding:8px 13px;
  border-radius:18px;
  cursor:pointer;
}

/* WRITE EPISODE */

.write-box{
  display:none;
  background:#fffdf9;
  border:1px solid #d8c7b4;
  border-radius:16px;
  padding:17px;
  margin-bottom:18px;
}

.write-box.show{
  display:block;
}

.write-box h3{
  margin-top:0;
}

.input{
  width:100%;
  border:1px solid #d4c0a7;
  border-radius:9px;
  padding:10px;
  margin-bottom:10px;
  background:#fffdf9;
  font-family:inherit;
  font-size:15px;
}

textarea.input{
  min-height:220px;
  resize:vertical;
}

.write-buttons{
  display:flex;
  gap:9px;
}

.primary-btn{
  border:0;
  background:#745337;
  color:#fff;
  border-radius:20px;
  padding:9px 16px;
  cursor:pointer;
}

.cancel-btn{
  border:1px solid #cdb9a1;
  background:#f8f0e4;
  color:#654a34;
  border-radius:20px;
  padding:9px 16px;
  cursor:pointer;
}

/* EMPTY */

.empty{
  background:#fffaf2;
  border:1px dashed #ccb99f;
  padding:25px;
  border-radius:14px;
  text-align:center;
  color:#806b55;
}

/* FOOTER */

.continue{
  text-align:center;
  margin:28px 0;
  color:#9a8066;
  font-size:14px;
}

.bottom-space{
  height:30px;
}

@media(max-width:600px){

  .story-top{
    gap:12px;
  }

  .cover-box{
    width:82px;
    height:115px;
  }

  .story-title{
    font-size:23px;
  }

  .episode-title{
    font-size:18px;
  }

  .episode-content{
    font-size:16px;
    line-height:1.8;
  }

  .encourage-box{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>
</head>

<body>

<header>
  <div class="header-row">
    <div class="logo">📖 कहानी संसार</div>
    <button class="search-btn" onclick="alert('Search सुविधा जल्द आएगी')">
      🔍 खोजें
    </button>
  </div>
</header>


<div class="container">

  <!-- STORY -->

  <div id="storyBox" class="story-box">

    <div class="story-top">

      <div class="cover-box" id="coverBox">
        <div class="no-cover">कोई Cover नहीं</div>
      </div>

      <div class="story-info">

        <h1 id="storyTitle" class="story-title">
          कहानी लोड हो रही है...
        </h1>

        <div class="author" id="authorName">
          लेखक
        </div>

        <div id="description" class="description"></div>

        <div class="stats">
          <span>👁 <b id="readCount">0</b> पढ़े</span>
          <span>⭐ <b id="ratingCount">0</b> Ratings</span>
        </div>

      </div>

    </div>


    <!-- STORY RATING -->

    <div class="rating-area">

      <div class="rating-title">
        कहानी को Rating दें
      </div>

      <div class="stars" id="storyStars">
        <button class="star" data-rating="1">★</button>
        <button class="star" data-rating="2">★</button>
        <button class="star" data-rating="3">★</button>
        <button class="star" data-rating="4">★</button>
        <button class="star" data-rating="5">★</button>
      </div>

      <div id="storyRatingMessage"></div>

    </div>


    <!-- ENCOURAGEMENT -->

    <div class="encourage-box">

      <span>
        ❤️ लेखक को प्रोत्साहित करें
      </span>

      <button
        class="encourage-btn"
        onclick="encourageAuthor()">
        लेखक को प्रोत्साहित करें
      </button>

    </div>

  </div>


  <!-- EPISODES -->

  <h2 class="section-title">
    📚 Episodes
  </h2>


  <!-- NEW EPISODE BUTTON -->

  <button
    id="newEpisodeButton"
    class="new-episode-btn"
    onclick="openNewEpisode()"
    style="display:none;">
    ＋ नया Episode लिखें
  </button>


  <!-- WRITE / EDIT EPISODE -->

  <div id="writeBox" class="write-box">

    <h3 id="writeHeading">
      नया Episode लिखें
    </h3>

    <input
      id="episodeTitleInput"
      class="input"
      type="text"
      placeholder="Episode का Title">

    <textarea
      id="episodeContentInput"
      class="input"
      placeholder="यहाँ Episode की कहानी लिखें..."></textarea>

    <div class="write-buttons">

      <button
        class="primary-btn"
        onclick="saveEpisode()">
        प्रकाशित करें
      </button>

      <button
        class="cancel-btn"
        onclick="closeWriteBox()">
        Cancel
      </button>

    </div>

  </div>


  <div id="episodes"></div>


  <div class="continue">
    ❦ कहानी जारी है… ❦
  </div>

  <div class="bottom-space"></div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://wnvkryudbeafebaluwgq.supabase.co";

/*
  यहाँ अपनी वही working Publishable Key डालना
  जो तुम्हारी बाकी working files में लगी है।
*/

const SUPABASE_KEY =
  "sb_publishable_q1J83vS9b3Ngw-Py_QLuzg_ub6pdy3D";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

const params =
new URLSearchParams(window.location.search);

const storyId =
params.get("id");

let storyData = null;

let editingEpisodeId = null;

let selectedStoryRating = 0;

let selectedReviewRatings = {};


/* =========================
   START
========================= */

if(!storyId){

  document.getElementById("storyTitle").textContent =
    "कहानी नहीं मिली";

}else{

  loadStory();

}


/* =========================
   LOAD STORY
========================= */

async function loadStory(){

  const {
    data,
    error
  } = await supabaseClient
    .from("Story")
    .select("*")
    .eq("id", storyId)
    .single();


  if(error){

    console.error(error);

    document.getElementById("storyTitle").textContent =
      "Story load नहीं हुई";

    return;
  }


  storyData = data;


  document.getElementById("storyTitle").textContent =
    data.title || "बिना Title";


  document.getElementById("authorName").textContent =
    "✍️ " + (data.author_name || "अज्ञात लेखक");


  document.getElementById("description").textContent =
    data.description || "";


  document.getElementById("readCount").textContent =
    data.read_count || 0;


  document.getElementById("ratingCount").textContent =
    data.rating_count || 0;


  /* COVER */

  const coverBox =
    document.getElementById("coverBox");


  const cover =
    data.cover_image ||
    data.image_url;


  if(cover){

    coverBox.innerHTML =
      `<img src="${cover}" alt="Story Cover">`;

  }


  /* AUTHOR CHECK */

  checkAuthor();


  /* READ COUNT */

  increaseReadCount();


  /* EPISODES */

  loadEpisodes();

}


/* =========================
   READ COUNT
========================= */

async function increaseReadCount(){

  const {
    error
  } = await supabaseClient
    .rpc(
      "increment_story_read_count",
      {
        story_id_input: storyId
      }
    );


  if(error){

    console.log(
      "Read count update error:",
      error
    );

  }

}


/* =========================
   AUTHOR CHECK
========================= */

async function checkAuthor(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(
    user &&
    storyData &&
    user.id === storyData.user_id
  ){

    document.getElementById(
      "newEpisodeButton"
    ).style.display = "block";

  }

}


/* =========================
   LOAD EPISODES
========================= */

async function loadEpisodes(){

  const container =
    document.getElementById("episodes");


  container.innerHTML =
    `<div class="empty">Episodes लोड हो रहे हैं...</div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("Episodes")
    .select(
      "id, story_id, episode_number, episode_title, content, user_id, created_at"
    )
    .eq("story_id", storyId)
    .order(
      "episode_number",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "Episodes error:",
      error
    );

    container.innerHTML =
      `<div class="empty">
        Episodes load नहीं हो पाए।<br>
        Console में error देखें।
      </div>`;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      `<div class="empty">
        इस कहानी में अभी कोई Episode प्रकाशित नहीं हुआ।
      </div>`;

    return;
  }


  container.innerHTML = "";


  data.forEach(
    episode => {

      createEpisodeCard(
        episode
      );

    }
  );

}


/* =========================
   EPISODE CARD
========================= */

function createEpisodeCard(episode){

  const container =
    document.getElementById("episodes");


  const card =
    document.createElement("div");

  card.className =
    "episode-card";


  const head =
    document.createElement("div");

  head.className =
    "episode-head";


  const number =
    document.createElement("div");

  number.className =
    "episode-number";

  number.textContent =
    "Episode " +
    episode.episode_number;


  const title =
    document.createElement("h3");

  title.className =
    "episode-title";

  title.textContent =
    episode.episode_title ||
    "बिना Title";


  const meta =
    document.createElement("div");

  meta.className =
    "episode-meta";

  meta.textContent =
    formatDate(episode.created_at);


  head.appendChild(number);
  head.appendChild(title);
  head.appendChild(meta);


  const actions =
    document.createElement("div");

  actions.className =
    "episode-actions";


  const openButton =
    document.createElement("button");

  openButton.className =
    "small-btn";

  openButton.textContent =
    "📖 पढ़ें";


  const content =
    document.createElement("div");

  content.className =
    "episode-content";


  const text =
    document.createElement("div");

  text.innerHTML =
    episode.content || "";


  content.appendChild(text);


  openButton.onclick =
    function(){

      content.classList.toggle(
        "open"
      );

      openButton.textContent =
        content.classList.contains("open")
        ? "🔽 बंद करें"
        : "📖 पढ़ें";

    };


  actions.appendChild(
    openButton
  );


  /* AUTHOR EDIT DELETE */

  if(
    storyData &&
    episode.user_id === storyData.user_id
  ){

    const editButton =
      document.createElement("button");

    editButton.className =
      "small-btn";

    editButton.textContent =
      "✏️ Edit";


    editButton.onclick =
      function(){

        openEditEpisode(
          episode
        );

      };


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "small-btn delete-btn";

    deleteButton.textContent =
      "🗑️ Delete";


    deleteButton.onclick =
      function(){

        deleteEpisode(
          episode.id
        );

      };


    actions.appendChild(
      editButton
    );

    actions.appendChild(
      deleteButton
    );

  }


  /* REVIEW */

  const review =
    createReviewBox(
      episode.id
    );


  card.appendChild(head);
  card.appendChild(actions);
  card.appendChild(content);
  card.appendChild(review);


  container.appendChild(card);

}


/* =========================
   REVIEW BOX
========================= */

function createReviewBox(
  episodeId
){

  const box =
    document.createElement("div");

  box.className =
    "review-box";


  const title =
    document.createElement("div");

  title.className =
    "review-title";

  title.textContent =
    "समीक्षा दें";


  const stars =
    document.createElement("div");

  stars.className =
    "review-stars";


  selectedReviewRatings[episodeId] = 0;


  for(
    let i=1;
    i<=5;
    i++
  ){

    const star =
      document.createElement("button");

    star.className =
      "review-star";

    star.textContent =
      "★";


    star.onclick =
      function(){

        selectedReviewRatings[episodeId] =
          i;


        const allStars =
          stars.querySelectorAll(
            ".review-star"
          );


        allStars.forEach(
          (s,index) => {

            s.classList.toggle(
              "active",
              index < i
            );

          }
        );

      };


    stars.appendChild(
      star
    );

  }


  const textarea =
    document.createElement("textarea");

  textarea.className =
    "review-text";

  textarea.id =
    "review-" + episodeId;

  textarea.placeholder =
    "इस Episode के बारे में अपनी समीक्षा लिखें... (अधिकतम 150 शब्द)";


  const actions =
    document.createElement("div");

  actions.className =
    "review-actions";


  const encourage =
    document.createElement("button");

  encourage.className =
    "encourage-btn";

  encourage.textContent =
    "❤️ प्रोत्साहित करें";


  encourage.onclick =
    function(){

      encourageAuthor();

    };


  const submit =
    document.createElement("button");

  submit.className =
    "submit-review";

  submit.textContent =
    "समीक्षा भेजें";


  submit.onclick =
    function(){

      submitReview(
        episodeId
      );

    };


  actions.appendChild(
    encourage
  );

  actions.appendChild(
    submit
  );


  box.appendChild(
    title
  );

  box.appendChild(
    stars
  );

  box.appendChild(
    textarea
  );

  box.appendChild(
    actions
  );


  return box;

}


/* =========================
   SUBMIT REVIEW
========================= */

async function submitReview(
  episodeId
){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    alert(
      "समीक्षा देने के लिए पहले Login करें।"
    );

    return;
  }


  const textarea =
    document.getElementById(
      "review-" + episodeId
    );


  const feedback =
    textarea.value.trim();


  const rating =
    selectedReviewRatings[episodeId] || 0;


  if(!rating){

    alert(
      "कृपया पहले Rating दें।"
    );

    return;
  }


  if(!feedback){

    alert(
      "कृपया अपनी समीक्षा लिखें।"
    );

    return;
  }


  const words =
    feedback
      .split(/\s+/)
      .filter(Boolean);


  if(words.length > 150){

    alert(
      "समीक्षा अधिकतम 150 शब्दों की हो सकती है।"
    );

    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("Feedback")
    .upsert(
      {
        episode_id:episodeId,
        user_id:user.id,
        rating:rating,
        feedback:feedback
      },
      {
        onConflict:
          "user_id,episode_id"
      }
    );


  if(error){

    console.error(error);

    alert(
      "Review error: " +
      error.message
    );

    return;
  }


  alert(
    "समीक्षा सफलतापूर्वक भेज दी गई। ❤️"
  );

}


/* =========================
   STORY RATING
========================= */

document
.querySelectorAll(".star")
.forEach(
  star => {

    star.addEventListener(
      "click",
      function(){

        selectedStoryRating =
          Number(
            this.dataset.rating
          );


        document
        .querySelectorAll(".star")
        .forEach(
          (s,index) => {

            s.classList.toggle(
              "active",
              index < selectedStoryRating
            );

          }
        );


        saveStoryRating(
          selectedStoryRating
        );

      }
    );

  }
);


/* =========================
   SAVE STORY RATING
========================= */

async function saveStoryRating(
  rating
){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    alert(
      "Rating देने के लिए पहले Login करें।"
    );

    return;
  }


  const {
    data:existing,
    error:findError
  } =
  await supabaseClient
    .from("Story_Ratings")
    .select("id")
    .eq("story_id",storyId)
    .eq("user_id",user.id)
    .maybeSingle();


  if(findError){

    console.error(findError);

    alert(
      "Rating error: " +
      findError.message
    );

    return;
  }


  let error;


  if(existing){

    ({
      error
    } =
    await supabaseClient
      .from("Story_Ratings")
      .update({
        rating:rating
      })
      .eq("id",existing.id));

  }else{

    ({
      error
    } =
    await supabaseClient
      .from("Story_Ratings")
      .insert({
        story_id:storyId,
        user_id:user.id,
        rating:rating
      }));

  }


  if(error){

    console.error(error);

    alert(
      "Rating error: " +
      error.message
    );

    return;
  }


  document
    .getElementById(
      "storyRatingMessage"
    )
    .textContent =
      "आपकी Rating सेव हो गई। ⭐";

}

/* =========================
   SAVE EPISODE
========================= */

async function saveEpisode(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    alert(
      "Episode लिखने के लिए पहले Login करें।"
    );

    return;
  }


  if(
    !storyData ||
    storyData.user_id !== user.id
  ){

    alert(
      "आप केवल अपनी कहानी में Episode जोड़ सकते हैं।"
    );

    return;
  }


  const title =
    document
      .getElementById(
        "episodeTitleInput"
      )
      .value
      .trim();


  const content =
    document
      .getElementById(
        "episodeContentInput"
      )
      .value
      .trim();


  if(!title){

    alert(
      "Episode का Title लिखें।"
    );

    return;
  }


  if(!content){

    alert(
      "Episode की कहानी लिखें।"
    );

    return;
  }


  /* EDIT */

  if(editingEpisodeId){

    const {
      error
    } =
    await supabaseClient
      .from("Episodes")
      .update({
        episode_title:title,
        content:content
      })
      .eq(
        "id",
        editingEpisodeId
      )
      .eq(
        "user_id",
        user.id
      );


    if(error){

      alert(
        "Episode update error: " +
        error.message
      );

      return;
    }


    alert(
      "Episode सफलतापूर्वक Edit हो गया।"
    );


  }

  /* NEW */

  else{

    const {
      data:lastEpisode,
      error:lastError
    } =
    await supabaseClient
      .from("Episodes")
      .select("episode_number")
      .eq("story_id",storyId)
      .order(
        "episode_number",
        {
          ascending:false
        }
      )
      .limit(1);


    if(lastError){

      alert(
        "Episode number error: " +
        lastError.message
      );

      return;
    }


    let nextNumber = 1;


    if(
      lastEpisode &&
      lastEpisode.length > 0
    ){

      nextNumber =
        Number(
          lastEpisode[0].episode_number
        ) + 1;

    }


    const {
      error
    } =
    await supabaseClient
      .from("Episodes")
      .insert({
        story_id:storyId,
        episode_number:nextNumber,
        episode_title:title,
        content:content,
        user_id:user.id
      });


    if(error){

      console.error(error);

      alert(
        "Episode publish error: " +
        error.message
      );

      return;
    }


    alert(
      "Episode " +
      nextNumber +
      " सफलतापूर्वक प्रकाशित हुआ। 🎉"
    );

  }


  closeWriteBox();

  loadEpisodes();

}


/* =========================
   DELETE EPISODE
========================= */

async function deleteEpisode(
  episodeId
){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    alert(
      "पहले Login करें।"
    );

    return;
  }


  const confirmDelete =
    confirm(
      "क्या आप यह Episode Delete करना चाहते हैं?"
    );


  if(!confirmDelete){

    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("Episodes")
    .delete()
    .eq(
      "id",
      episodeId
    )
    .eq(
      "user_id",
      user.id
    );


  if(error){

    console.error(error);

    alert(
      "Delete error: " +
      error.message
    );

    return;
  }


  alert(
    "Episode Delete हो गया।"
  );


  loadEpisodes();

}

/* =========================
   DATE
========================= */

function formatDate(
  value
){

  if(!value){

    return "";

  }


  const date =
    new Date(value);


  return date.toLocaleDateString(
    "hi-IN",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}
