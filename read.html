<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>कहानी पढ़ें • कहानी संसार</title>

<style>
* {
  box-sizing: border-box;
}
  body {
  margin: 0;
  background: #f4efe6;
  color: #3d352d;
  font-family: Georgia, "Noto Serif Devanagari", serif;
}

.topbar {
  padding: 18px 7%;
  background: #fffaf2;
  border-bottom: 1px solid #e4d8c8;
}
  .logo {
  font-size: 22px;
  font-weight: bold;
}

.back {
  display: inline-block;
  margin-top: 10px;
  color: #76543d;
  text-decoration: none;
}

.reading-area {
  max-width: 820px;
  margin: 45px auto;
  padding: 55px 65px;
  background: #fffdf8;
  box-shadow: 0 8px 35px rgba(70, 50, 30, 0.10);
  border-radius: 8px;
}

.language {
  font-size: 14px;
  color: #8a735e;
  margin-bottom: 15px;
  }

h1 {
  font-size: 42px;
  margin: 0 0 10px;
  line-height: 1.3;
}

.author {
  color: #786656;
  margin-bottom: 35px;
}
  .story-content {
  font-size: 21px;
  line-height: 2;
  white-space: pre-line;
}

footer {
  text-align: center;
  padding: 30px;
  color: #8a7a69;
}

@media (max-width: 700px) {
  .reading-area {
    margin: 20px 12px;
    padding: 35px 24px;
  }

  h1 {
    font-size: 32px;
  }

  .story-content {
    font-size: 19px;
  }
}
  </style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header class="topbar">
  <div class="logo">📖 कहानी संसार</div>
  <a class="back" href="index.html">← कहानियों पर वापस जाएँ</a>
</header>
  <main class="reading-area">

  <div class="language">
    मूल भाषा: हिंदी
  </div>

  <h1 id="story-title">कहानी</h1>

  <div class="author">
    ✍️ लेखक: <span id="story-author"></span>
  </div>

  <div class="story-content" id="story-content">
    कहानी लोड हो रही है...
    </div>

</main>

<footer>
  कहानी संसार • साहित्य, भाषा और सीख
</footer>
  <script>
const SUPABASE_URL = "https://wnvkryudbeafebaluwgq.supabase.co";
const SUPABASE_KEY = "अपनी वही Supabase key यहाँ डालो";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadStory() {

  const params = new URLSearchParams(window.location.search);
  const storyId = params.get("id");

  if (!storyId) {
    document.getElementById("story-content").textContent =
      "कहानी नहीं मिली।";
    return;
  }

  const { data, error } = await supabaseClient
    .from("Story")
    .select("*")
    .eq("id", storyId)
    .single();

  if (error) {
    document.getElementById("story-content").textContent =
      "कहानी लोड नहीं हो सकी।";
    console.log(error);
    return;
  }
    document.getElementById("story-title").textContent = data.title;
  document.getElementById("story-author").textContent = data.author_name;
  document.getElementById("story-content").textContent = data.content;
}

loadStory();
</script>
</body>
</html>
