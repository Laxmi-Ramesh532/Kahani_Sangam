<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कहानी संसार — Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  </head>

<body>

  <h1>कहानी संसार</h1>

  <h2>Login / Signup</h2>

  <input type="email" id="email" placeholder="Email">
  <br><br>

  <input type="password" id="password" placeholder="Password">
  <br><br>
      <button id="loginBtn">Login</button>
      <button id="signupBtn">Signup</button>

  <script>
    alert("ab script shuru ho gayi");
  const SUPABASE_URL = "https://wnvkryudbeafebaluwgq.supabase.co";
  const SUPABASE_KEY ="sb_publishable_q1J83vS9b3Ngw-Py_QLuzg_ub6pdy3D";
    alert("line chal rahi hai");
  
  let supabase;

     alert("second script shuru");

  try {
    supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    alert("createClient successful");

  } catch (error) {
    alert("Supabase Error: " + error.message);
  }
    </script>
  
  


  // =========================
  // SIGNUP
  // =========================
<script>
  document.getElementById("signupBtn").addEventListener("click", async function () {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("Email aur password bharo.");
      return;
    }

    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      alert("Signup Error: " + error.message);
      return;
    }

    alert("Signup successful! Email check karo.");
  });


  // =========================
  // LOGIN
  // =========================

  document.getElementById("loginBtn").addEventListener("click", async function () {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("Email aur password bharo.");
      return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      alert("Login Error: " + error.message);
      return;
    }

    alert("Login successful!");
  });

</script>
</body>
</html>
