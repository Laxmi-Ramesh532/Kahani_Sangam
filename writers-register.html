<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>लेखक बनें - कहानी संसार</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f5ef;
      color: #302820;
      font-family: Georgia, "Noto Serif Devanagari",
                   "Mangal", serif;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: 25px auto 50px;
    }

    .top-box {
      background: #fffdf9;
      border: 1px solid #d8cbb8;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    h1 {
      text-align: center;
      margin-top: 5px;
      margin-bottom: 25px;
      font-size: 30px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cdbfae;
      border-radius: 9px;
      background: white;
      color: #302820;
      font-size: 17px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #8f7658;
    }

    .editor {
      min-height: 350px;
      width: 100%;
      padding: 18px;
      background: white;
      border: 1px solid #cdbfae;
      border-radius: 10px;
      font-size: 19px;
      line-height: 2;
      outline: none;
    }

    .editor:focus {
      border-color: #8f7658;
    }

    .editor img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 18px auto;
      cursor: pointer;
      border-radius: 5px;
    }

    .image-section {
      margin-top: 22px;
      padding: 16px;
      border: 1px dashed #cdbfae;
      border-radius: 10px;
      background: #fffaf3;
    }

    .image-section input[type="file"] {
      border: none;
      padding: 5px;
      background: transparent;
    }

    .cover-preview {
      display: none;
      margin-top: 12px;
      text-align: center;
    }

    .cover-preview img {
      max-width: 180px;
      max-height: 180px;
      border-radius: 8px;
      border: 1px solid #cdbfae;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #594633;
      color: white;
      font-size: 19px;
      font-family: inherit;
      cursor: pointer;
    }

    .submit-btn:hover {
      opacity: 0.92;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 17px;
      min-height: 25px;
    }

    /* Image long-press menu */

    .image-menu {
      display: none;
      position: fixed;
      z-index: 9999;
      min-width: 180px;
      background: white;
      border: 1px solid #cdbfae;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.18);
      overflow: hidden;
    }

    .image-menu button {
      display: block;
      width: 100%;
      padding: 12px 15px;
      border: none;
      background: white;
      text-align: left;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    .image-menu button:hover {
      background: #f4eee5;
    }

    /* Resize handle */

    .selected-image {
      outline: 2px dashed #9a805f;
    }

    .resize-box {
      display: none;
      position: fixed;
      z-index: 9998;
      background: white;
      border: 1px solid #cdbfae;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.18);
    }

    .resize-box input {
      width: 150px;
    }

    .resize-box button {
      margin-top: 8px;
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      background: #594633;
      color: white;
      font-family: inherit;
      cursor: pointer;
    }

    @media (max-width: 600px) {

      .container {
        width: 94%;
        margin-top: 15px;
      }

      .top-box {
        padding: 18px;
      }

      h1 {
        font-size: 25px;
      }

      label {
        font-size: 17px;
      }

      input,
      select {
        font-size: 16px;
      }

      .editor {
        min-height: 330px;
        font-size: 19px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="top-box">

      <h1>✍️ लेखक बनें</h1>

      <div class="field">
        <label for="author">
          लेखक का नाम
        </label>

        <input

        </label>

        <input

      </div>


      <div class="field">

          मूल भाषा
        </label>

        <select id="language">

          <option value="">
            भाषा चुनें
          </option>

          <option value="हिंदी">
            हिंदी
          </option>

          <option value="अंग्रेज़ी">
            अंग्रेज़ी
          </option>

          <option value="उर्दू">
            उर्दू
          </option>

          <option value="बंगाली">
            बंगाली
          </option>

          <option value="मराठी">
            मराठी
          </option>

          <option value="तमिल">
            तमिल
          </option>

          <option value="तेलुगु">
            तेलुगु
          </option>

          <option value="अन्य">
            अन्य
          </option>

        </select>
      </div>


      <div class="field">
        <label for="age_category">
          आयु वर्ग
        </label>

        <select id="age_category">

          <option value="">
            आयु वर्ग चुनें
          </option>

          <option value="15 तक">
            15 वर्ष तक
          </option>

          <option value="16+">
            16 वर्ष और अधिक
          </option>

        </select>
      </div>


      <div class="field">
        <label for="category">
          कहानी की श्रेणी
        </label>

        <select id="category">

          <option value="">

          </option>

          <option value="कहानी">
            कहानी
          </option>

          <option value="लोककथा">

          </option>

          <option value="लोकगीत">
            लोकगीत
          </option>

          <option value="रहस्यमयी कथा">
            रहस्यमयी कथा
          </option>

          <option value="प्रेरणादायक कहानी">
            प्रेरणादायक कहानी
          </option>

          <option value="ऐतिहासिक कथा">
            ऐतिहासिक कथा
          </option>

          <option value="हॉरर स्टोरी">
            हॉरर स्टोरी
          </option>

          <option value="रोमांटिक स्टोरी">

          </option>

          <option value="लघुकथा">
            लघुकथा
          </option>

          <option value="कविता">
            कविता
          </option>

          <option value="संस्मरण">
            संस्मरण
          </option>

          <option value="धार्मिक कहानी">
            धार्मिक कहानी
          </option>

          <option value="पारिवारिक कहानी">

          </option>

            अन्य
          </option>

        </select>
      </div>


      <div class="field">

        <label for="content">
          अपनी रचना लिखें
        </label>

        <div

          spellcheck="true"
        ></div>

      </div>


      <!-- Optional Cover -->

      <div class="image-section">

        <label for="storyImage">
          कहानी का Cover Picture
          <span style="font-weight:normal;">
            (वैकल्पिक)
          </span>
        </label>

        <input
          type="file"
          id="storyImage"
          accept="image/*"
        >

        <div
          class="cover-preview"

      <button

    </div>

  </div>


  <!-- Image option menu -->

  <div
    id="imageMenu"
    class="image-menu"
  >

    <button
      type="button"
      onclick="addImageFromMenu()"
    >
      🖼️ चित्र बदलें
    </button>

    <button
      type="button"
      onclick="openResizeBox()"
    >
      ↔️ चित्र का आकार बदलें
    </button>

    <button
      type="button"
      onclick="removeSelectedImage()"

      🗑️ चित्र हटाएँ
    </button>

  </div>


  <!-- Resize menu -->

  <div
    id="resizeBox"
    class="resize-box"
  >

    <div>
      चित्र का आकार
    </div>

    <input
      id="imageWidth"
      type="range"
      min="20"
      max="100"
      value="70"
    >

    <div id="imageWidthText">
      70%
    </div>

    <button
      type="button"
      onclick="applyImageSize()"

      लागू करें
    </button>

  </div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://wnvkryudbeafebaluwgq.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_q1J83vS9b3Ngw-Py_QLuzg_ub6pdy3D";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================
   BASIC VARIABLES
========================= */

let selectedImage = null;
let longPressTimer = null;


/* =========================
   COVER PREVIEW
========================= */

document
  .getElementById("storyImage")
  .addEventListener(
    "change",
    function () {

      const file = this.files[0];

      if (!file) {
        return;
      }

      const reader =
        new FileReader();

      reader.onload = function (e) {

        const preview =
          document.getElementById(
            "coverPreview"
          );

        const image =
          document.getElementById(
            "coverPreviewImage"
          );

        image.src = e.target.result;

        preview.style.display = "block";

      };

      reader.readAsDataURL(file);

    }
  );


/* =========================
   IMAGE FROM CONTENT
========================= */

document
  .getElementById("content")
  .addEventListener(
    "contextmenu",
    function (event) {

      const image =
        event.target.closest("img");

      if (!image) {
        return;
      }

      event.preventDefault();

      selectedImage = image;

      showImageMenu(
        event.clientX,
        event.clientY
      );

    }
  );


/* =========================
   LONG PRESS
========================= */

document
  .getElementById("content")
  .addEventListener(
    "touchstart",
    function (event) {

      const image =
        event.target.closest("img");

      if (!image) {
        return;
      }

      selectedImage = image;

      longPressTimer =
        setTimeout(
          function () {

            const touch =
              event.touches[0];

            showImageMenu(
              touch.clientX,
              touch.clientY
            );

          },
          650
        );

    },
    {
      passive: true
    }
  );


document
  .getElementById("content")
  .addEventListener(
    "touchend",
    function () {

      clearTimeout(
        longPressTimer
      );

    }
  );


document
  .getElementById("content")
  .addEventListener(
    "touchmove",
    function () {

      clearTimeout(
        longPressTimer
      );

    }
  );


/* =========================
   IMAGE MENU
========================= */

function showImageMenu(x, y) {

  const menu =
    document.getElementById(
      "imageMenu"
    );

  menu.style.display = "block";

  const maxX =
    window.innerWidth -
    menu.offsetWidth -
    10;

  const maxY =
    window.innerHeight -
    menu.offsetHeight -
    10;

  menu.style.left =
    Math.max(
      10,
      Math.min(x, maxX)
    ) + "px";

  menu.style.top =
    Math.max(
      10,
      Math.min(y, maxY)
    ) + "px";
}


function hideImageMenu() {

  document
    .getElementById(
      "imageMenu"
    )
    .style.display = "none";

}


/* =========================
   ADD / CHANGE IMAGE
========================= */

function addImageFromMenu() {

  hideImageMenu();

  const input =
    document.createElement(
      "input"
    );

  input.type = "file";
  input.accept = "image/*";

  input.onchange =
    function () {

      const file =
        this.files[0];

      if (!file) {
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        function (e) {

          if (!selectedImage) {
            return;
          }

          selectedImage.src =
            e.target.result;

        };

      reader.readAsDataURL(file);

    };

  input.click();

}


/* =========================
   RESIZE
========================= */

function openResizeBox() {

  hideImageMenu();

  if (!selectedImage) {
    return;
  }

  selectedImage.classList.add(
    "selected-image"
  );

  const box =
    document.getElementById(
      "resizeBox"
    );

  const width =
    selectedImage.getBoundingClientRect()
      .width;

  const editorWidth =
    document
      .getElementById("content")
      .getBoundingClientRect()
      .width;

  let percent =
    Math.round(
      (width / editorWidth) * 100
    );

  percent =
    Math.max(
      20,
      Math.min(
        100,
        percent
      )
    );

  const slider =
    document.getElementById(
      "imageWidth"
    );

  slider.value =
    percent;

  document
    .getElementById(
      "imageWidthText"
    )
    .innerText =
    percent + "%";

  slider.oninput =
    function () {

      document
        .getElementById(
          "imageWidthText"
        )
        .innerText =
        this.value + "%";

    };

  box.style.display =
    "block";

  const rect =
    selectedImage
      .getBoundingClientRect();

  let left =
    rect.left;

  let top =
    rect.bottom + 10;

  if (
    left + 180 >
    window.innerWidth
  ) {
    left =
      window.innerWidth - 190;
  }

  if (
    top + 100 >
    window.innerHeight
  ) {
    top =
      rect.top - 110;
  }

  box.style.left =
    Math.max(
      10,
      left
    ) + "px";

  box.style.top =
    Math.max(
      10,
      top
    ) + "px";

}


function applyImageSize() {

  if (!selectedImage) {
    return;
  }

  const value =
    document
      .getElementById(
        "imageWidth"
      )
      .value;

  selectedImage.style.width =
    value + "%";

  selectedImage.style.height =
    "auto";

  selectedImage.classList.remove(
    "selected-image"
  );

  document
    .getElementById(
      "resizeBox"
    )
    .style.display =
    "none";

}


/* =========================
   DELETE IMAGE
========================= */

function removeSelectedImage() {

  hideImageMenu();

  if (!selectedImage) {
    return;
  }

  selectedImage.remove();

  selectedImage = null;

}


/* =========================
   CLOSE MENUS
========================= */

document.addEventListener(
  "click",
  function (event) {

    const menu =
      document.getElementById(
        "imageMenu"
      );

    const resize =
      document.getElementById(
        "resizeBox"
      );

    if (
      !menu.contains(event.target) &&
      event.target !== selectedImage
    ) {
      menu.style.display =
        "none";
    }

    if (
      !resize.contains(event.target)
    ) {
      if (
        !event.target.closest("img")
      ) {

        resize.style.display =
          "none";

      }
    }

  }
);


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadImage(
  file,
  folder
) {

  const extension =
    file.name
      .split(".")
      .pop();

  const fileName =
    folder +
    "/" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;

  const {
    error
  } =
    await supabaseClient
      .storage
      .from("story-images")
      .upload(
        fileName,
        file
      );

  if (error) {
    throw error;
  }

  const {
    data
  } =
    supabaseClient
      .storage
      .from("story-images")
      .getPublicUrl(
        fileName
      );

  return data.publicUrl;

}


/* =========================
   EDIT STORY LOADING
========================= */

async function loadStoryForEdit() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const storyId =
    params.get("edit");

  if (!storyId) {
    return;
  }

  try {

    const {
      data: sessionData
    } =
      await supabaseClient
        .auth
        .getSession();

    const session =
      sessionData.session;

    if (!session) {

      alert(
        "कहानी edit करने के लिए पहले login करें।"
      );

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("Story")
        .select("*")
        .eq("id", storyId)
        .single();


    if (error) {
      throw error;
    }


    if (
      data.user_id !==
      session.user.id
    ) {

      alert(
        "आप इस कहानी को edit नहीं कर सकते।"
      );

      return;

    }


    document
      .getElementById("author")
      .value =
      data.author_name || "";


    document
      .getElementById("title")
      .value =
      data.title || "";


    document
      .getElementById("language")
      .value =
      data.language || "";


    document
      .getElementById("age_category")
      .value =
      data.age_category || "";


    document
      .getElementById("category")
      .value =
      data.category || "";


    document
      .getElementById("content")
      .innerHTML =
      data.content || "";


    document
      .getElementById("submitBtn")
      .innerText =
      "💾 कहानी अपडेट करें";


    document
      .getElementById("submitBtn")
      .dataset.editId =
      storyId;


  } catch (error) {

    console.error(
      "Edit loading error:",
      error
    );

    alert(
      error.message
    );

  }

}


/* =========================
   SUBMIT STORY
========================= */

async function submitStory() {

  const message =
    document.getElementById(
      "message"
    );

  const button =
    document.getElementById(
      "submitBtn"
    );


  message.innerText =
    "कृपया प्रतीक्षा करें...";

  button.disabled =
    true;


  try {

    /* LOGIN CHECK */

    const {
      data: sessionData
    } =
      await supabaseClient
        .auth
        .getSession();

    const session =
      sessionData.session;


    if (!session) {

      alert(
        "कहानी प्रकाशित करने के लिए पहले Login करें।"
      );

      button.disabled =
        false;

      return;

    }


    /* FORM VALUES */

    const author =
      document
        .getElementById("author")
        .value
        .trim();


    const title =
      document
        .getElementById("title")
        .value
        .trim();


    const language =
      document
        .getElementById("language")
        .value;


    const ageCategory =
      document
        .getElementById("age_category")
        .value;


    const category =
      document
        .getElementById("category")
        .value;


    const content =
      document
        .getElementById("content")
        .innerHTML
        .trim();


    if (
      !author ||
      !title ||
      !content ||
      !ageCategory
    ) {

      alert(
        "कृपया नाम, कहानी का नाम, आयु वर्ग और कहानी लिखें।"
      );

      button.disabled =
        false;

      return;

    }


    /* EDIT OR NEW STORY */

    const editId =
      button.dataset.editId;


    if (editId) {

      const {
        error
      } =
        await supabaseClient
          .from("Story")
          .update({

            title: title,

            content: content,

            author_name: author,

            language: language,

            age_category:
              ageCategory,

            category:
              category

          })
          .eq(
            "id",
            editId
          )
          .eq(
            "user_id",
            session.user.id
          );


      if (error) {
        throw error;
      }


      message.innerText =
        "🎉 आपकी कहानी सफलतापूर्वक अपडेट हो गई!";


      button.disabled =
        false;


      return;

    }


    /* NEW STORY */

    let coverUrl =
      null;


    const coverInput =
      document.getElementById(
        "storyImage"
      );


    const coverFile =
      coverInput.files[0];


    if (coverFile) {

      coverUrl =
        await uploadImage(
          coverFile,
          "covers"
        );

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("Story")
        .insert({

          title: title,

          content: content,

          author_name: author,

          language: language,

          age_category:
            ageCategory,

          category:
            category,

          user_id:
            session.user.id,

          cover_image:
            coverUrl,

          read_count: 0,

          rating_sum: 0,

          rating_count: 0

        })
        .select()
        .single();


    if (error) {
      throw error;
    }


    console.log(
      "Story created:",
      data
    );


    message.innerText =
      "🎉 आपकी कहानी सफलतापूर्वक प्रकाशित हो गई!";


    /* CLEAR FORM */

    document
      .getElementById("author")
      .value = "";


    document
      .getElementById("title")
      .value = "";


    document
      .getElementById("language")
      .value = "";


    document
      .getElementById("age_category")
      .value = "";


    document
      .getElementById("category")
      .value = "";


    document
      .getElementById("content")
      .innerHTML = "";


    document
      .getElementById("storyImage")
      .value = "";


    document
      .getElementById(
        "coverPreview"
      )
      .style.display =
      "none";


    alert(
      "🎉 आपकी कहानी सफलतापूर्वक प्रकाशित हो गई!"
    );


  } catch (error) {

    console.error(
      "Submit error:",
      error
    );

    message.innerText =
      "❌ कहानी प्रकाशित नहीं हो सकी।";


    alert(
      "Error: " +
      error.message
    );

  } finally {

    button.disabled =
      false;

  }

}

loadStoryForEdit();
