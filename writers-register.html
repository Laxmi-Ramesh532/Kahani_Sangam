
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>लेखक बनें • कहानी संसार</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#ead8bd;
  color:#4b301c;
  font-family:Georgia,"Noto Serif Devanagari",serif;
}

header{
  background:#302219;
  color:#f8ead2;
  padding:16px 25px;
}

.header-inner{
  max-width:1000px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.back{
  color:#f8ead2;
  text-decoration:none;
  border:1px solid #c99b57;
  padding:8px 15px;
  border-radius:20px;
}

.container{
  max-width:850px;
  margin:40px auto;
  padding:0 18px;
}

.form-box{
  background:#f9efdf;
  padding:45px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  border:1px solid #d4b487;
}

.decor{
  text-align:center;
  font-size:30px;
  margin-bottom:10px;
}

h1{
  text-align:center;
  font-size:38px;
  margin:10px 0;
}

.intro{
  text-align:center;
  font-size:17px;
  line-height:1.8;
  margin-bottom:35px;
}

label{
  display:block;
  font-weight:bold;
  margin:18px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #cdb083;
  border-radius:9px;
  background:#fffaf1;
  color:#3f2b1d;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:300px;
  resize:vertical;
  line-height:1.9;
}
  .story-editor{
  width:100%;
  min-height:300px;
  padding:13px;
  border:1px solid #cdb083;
  border-radius:9px;
  background:#fffaf1;
  color:#3f2b1d;
  font-size:16px;
  font-family:inherit;
  line-height:1.9;
  outline:none;
  overflow-y:auto;
}

.story-editor:empty::before{
  content:attr(data-placeholder);
  color:#999;
}
  .crop-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.crop-box{
  background:#f9efdf;
  width:100%;
  max-width:500px;
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.crop-area{
  position:relative;
  display:inline-block;
  max-width:100%;
  overflow:hidden;
}

.crop-area img{
  display:block;
  max-width:100%;
  max-height:60vh;
}

#cropSelection{
  position:absolute;
  width:70%;
  aspect-ratio:1 / 1;
  left:15%;
  top:15%;
  border:2px solid white;
  box-shadow:0 0 0 9999px rgba(0,0,0,.45);
  cursor:move;
  touch-action:none;
}

.crop-buttons{
  margin-top:15px;
}

button{
  display:block;
  margin:30px auto 5px;
  padding:13px 30px;
  border:0;
  border-radius:25px;
  background:#4b301c;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#message{
  text-align:center;
  margin-top:20px;
  font-weight:bold;
}

.note{
  margin-top:25px;
  padding:15px;
  background:#f0dfc5;
  border-radius:10px;
  line-height:1.7;
  font-size:14px;
}

@media(max-width:600px){
  .form-box{
    padding:25px 18px;
  }

  h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">📖 कहानी संसार</div>
    <a class="back" href="index.html">← वापस</a>
  </div>
</header>

<main class="container">

  <section class="form-box">

    <div class="decor">🌸 🦋 🌸</div>

    <h1>✍️ अपनी कहानी लिखें</h1>

    <p class="intro">
      आपकी कहानी किसी पाठक की कल्पना को छू सकती है।
      अपनी मौलिक रचना यहाँ साझा करें और कहानी संसार का हिस्सा बनें।
    </p>

    <label for="author">लेखक का नाम</label>
    <input
      id="author"
      type="text"
      placeholder="अपना नाम लिखें"
    >

    <label for="title">कहानी का नाम</label>
    <input
      id="title"
      type="text"
      placeholder="अपनी कहानी का शीर्षक लिखें"
    >

    <label for="language">मूल भाषा</label>
    <select id="language">
      <option value="हिंदी">हिंदी</option>
      <option value="अवधी">अवधी</option>
      <option value="भोजपुरी">भोजपुरी</option>
      <option value="उर्दू">उर्दू</option>
      <option value="अन्य">अन्य</option>
    </select>
    
    <label for="age_category">कहानी किस उम्र के पाठकों के लिए है?</label>
    <select id="age_category">
      <option value="">उम्र चुनें</option>
      <option value="15 तक">15 वर्ष तक</option>
      <option value="16+">16 वर्ष और अधिक</option>
      
  </select>
    <label for="category">कहानी की श्रेणी चुनें</label>
<select id="category">
  <option value="">श्रेणी चुनें</option>
  <option value="कहानी">कहानी</option>
  <option value="लोककथा">लोककथा</option>
  <option value="लोकगीत">लोकगीत</option>
  <option value="रहस्यमयी कथा">रहस्यमयी कथा</option>
  <option value="प्रेरणादायक कहानी">प्रेरणादायक कहानी</option>
  <option value="ऐतिहासिक कथा">ऐतिहासिक कथा</option>
</select>
    
    <label for="chapters">कहानी के भाग / उप-विषय</label>
<textarea
  id="chapters"
  placeholder="उदाहरण:
भाग 1 — रहस्यमयी शुरुआत
भाग 2 — अनजानी दुनिया
भाग 3 — नई दोस्ती
भाग 4 — घर वापसी"
></textarea>
    <label for="content">अपनी कहानी</label>

<div
  id="content"
  contenteditable="true"
  class="story-editor"
  data-placeholder="यहाँ अपनी पूरी कहानी लिखें..."
></div>

    
    <label for="storyImage">कहानी के लिए चित्र (वैकल्पिक)</label>
<input
  id="storyImage"
  type="file"
  accept="image/*"
>
      <div style="text-align:center; margin-top:10px;">
  <button type="button" onclick="changeImageSize('small')">
    छोटा
  </button>

  <button type="button" onclick="changeImageSize('medium')">
    मध्यम
  </button>

  <button type="button" onclick="changeImageSize('large')">
    बड़ा
  </button>
      </div>

    <button id="submitBtn" onclick="submitStory()">
      📖 कहानी प्रकाशित करें
    </button>

    <div id="message"></div>

    <div class="note">
      🌱 <strong>एक छोटी-सी बात:</strong>
      कृपया अपनी मौलिक रचना साझा करें या ऐसी रचना जिसके प्रकाशन की
      अनुमति आपके पास हो।
    </div>

  </section>

</main>

<script>

const SUPABASE_URL =
"https://wnvkryudbeafebaluwgq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_q1J83vS9b3Ngw-Py_QLuzg_ub6pdy3D";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
  let selectedImage = null;
let savedRange = null;

const editor = document.getElementById("content");

function saveSelection() {
  const selection = window.getSelection();

  if (selection.rangeCount > 0) {
    const range = selection.getRangeAt(0);

    if (editor.contains(range.commonAncestorContainer)) {
      savedRange = range.cloneRange();
    }
  }
}

editor.addEventListener("blur", saveSelection);
  editor.addEventListener("mousedown", function () {
  saveSelection();
});

document
  .getElementById("storyImage")
  .addEventListener("change", async function () {

    const file = this.files[0];

    if (!file) return;

    const fileExt =
      file.name.split(".").pop();

    const fileName =
      `${crypto.randomUUID()}.${fileExt}`;

    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("story-images")
        .upload(fileName, file);

    if (uploadError) {
      console.log(uploadError);
      alert(
        "चित्र upload नहीं हो सका। कृपया दोबारा कोशिश करें।"
      );
      return;
    }

    const { data: publicUrlData } =
      supabaseClient
        .storage
        .from("story-images")
        .getPublicUrl(fileName);

    const image =
      document.createElement("img");

    image.src =
      publicUrlData.publicUrl;

    image.className =
      "story-editor-image";

    image.style.width = "60%";
    image.style.maxWidth = "100%";
    image.style.display = "block";
    image.style.margin = "15px auto";
    image.onclick = function (event) {
  event.stopPropagation();

  alert("चित्र पर क्लिक हुआ");
      alert("selectedImage set होने वाला है");

selectedImage = image;

alert("selectedImage set हो गया");
alert("cropImage ढूँढने वाला हूँ"); 
      
  

  const cropImage =
    document.getElementById("cropImage");

  cropImage.src = image.src;
      alert("image source set हो गया");
      alert("cropImage मिल गया");

  document.getElementById("cropModal").style.display = "flex";
      
  alert("Modal खुलने की कोशिश हुई");
      
};
    editor.focus();

    if (savedRange) {

      const selection =
        window.getSelection();

      selection.removeAllRanges();

      selection.addRange(savedRange);

      savedRange = null;
    }

    const selection =
      window.getSelection();

    if (selection.rangeCount > 0) {

      const range =
        selection.getRangeAt(0);

      range.deleteContents();

      range.insertNode(image);

      range.setStartAfter(image);

      range.collapse(true);

      selection.removeAllRanges();

      selection.addRange(range);

    } else {

      editor.appendChild(image);
    }

    this.value = "";
  });


function changeImageSize(size) {

  if (!selectedImage) {

    alert(
      "पहले कहानी में किसी चित्र पर टैप करें।"
    );

    return;
  }

  if (size === "small") {
    selectedImage.style.width = "30%";
  }

  if (size === "medium") {
    selectedImage.style.width = "60%";
  }

  if (size === "large") {
    selectedImage.style.width = "90%";
  }
}
  async function loadStoryForEdit() {

  const params = new URLSearchParams(window.location.search);
  const storyId = params.get("edit");

  if (!storyId) {
    return;
  }

  const { data: { session } } =
    await supabaseClient.auth.getSession();

  if (!session) {
    alert("कहानी edit करने के लिए पहले Login करें।");
    window.location.href = "login.html";
    return;
  }

  const { data: story, error } =
    await supabaseClient
      .from("Story")
      .select("*")
      .eq("id", storyId)
      .single();

  if (error) {
    console.log(error);
    alert("कहानी की जानकारी नहीं मिल सकी।");
    return;
  }

  if (story.user_id !== session.user.id) {
    alert("आप इस कहानी को edit नहीं कर सकते।");
    window.location.href = "index.html";
    return;
  }

  document.getElementById("author").value = story.author_name || "";
  document.getElementById("title").value = story.title || "";
  document.getElementById("language").value = story.language || "";
  document.getElementById("age_category").value = story.age_category || "";
  document.getElementById("category").value = story.category || "";
  document.getElementById("chapters").value = story.chapters || "";
  document.getElementById("content").innerHTML= story.content || "";

  document.getElementById("submitBtn").textContent =
    "💾 कहानी अपडेट करें";
}

loadStoryForEdit();

async function submitStory(){
  const { data: { session } } =
  await supabaseClient.auth.getSession();

if (!session) {
  alert("कहानी प्रकाशित करने के लिए पहले Login करें।");
  window.location.href = "login.html";
  return;
}

  const author =
    document.getElementById("author").value.trim();

  const title =
    document.getElementById("title").value.trim();

  const language =
    document.getElementById("language").value;
  
  const ageCategory =
  document.getElementById("age_category").value;
  const category =
  document.getElementById("category").value;
  
  const chapters =
  document.getElementById("chapters").value.trim();
  

  const content =
    document.getElementById("content").innerHTML.trim();

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("submitBtn");
  if(!author || !title || !content || !ageCategory){

  message.textContent =
    "कृपया लेखक का नाम, कहानी का नाम, कहानी और उम्र की श्रेणी चुनें।";

  return;
  }

  button.disabled = true;
  button.textContent = "⏳ कहानी सेव हो रही है...";
  const params = new URLSearchParams(window.location.search);
const editId = params.get("edit");
  
let data;
let error;

if (editId) {

  const result = await supabaseClient
    .from("Story")
    .update({
      title: title,
      content: content,
      author_name: author,
      age_category: ageCategory,
      chapters: chapters,
      category: category
    })
    .eq("id", editId)
    .select();

  data = result.data;
  error = result.error;

} else {

  const result = await supabaseClient
    .from("Story")
    .insert([
      {
        title: title,
        content: content,
        author_name: author,
        age_category: ageCategory,
        chapters: chapters,
        category: category,
        user_id: (await supabaseClient.auth.getUser()).data.user.id
      }
    ])
    .select();

  data = result.data;
  error = result.error;
}  if(error){

  console.log(error);

  message.textContent =
    editId
      ? "कहानी अपडेट नहीं हो सकी। कृपया दोबारा कोशिश करें।"
      : "कहानी सेव नहीं हो सकी। कृपया दोबारा कोशिश करें।";

  button.disabled = false;
  button.textContent =
    editId
      ? "💾 कहानी अपडेट करें"
      : "📖 कहानी प्रकाशित करें";

  return;
  }
  if (editId) {
  message.textContent =
    "✅ आपकी कहानी सफलतापूर्वक अपडेट हो गई!";
} else {
  message.textContent =
    "🎉 आपकी कहानी सफलतापूर्वक प्रकाशित हो गई!";
  }

  document.getElementById("author").value = "";
  document.getElementById("title").value = "";
  document.getElementById("content").innerHTML = "";

  button.disabled = false;
  button.textContent = "📖 कहानी प्रकाशित करें";
}
let isDraggingCrop = false;
let startX = 0;
let startY = 0;
let startLeft = 0;
let startTop = 0;

const cropSelection =
  document.getElementById("cropSelection");

cropSelection.addEventListener("pointerdown", function(event) {

  isDraggingCrop = true;

  startX = event.clientX;
  startY = event.clientY;

  startLeft = cropSelection.offsetLeft;
  startTop = cropSelection.offsetTop;

  cropSelection.setPointerCapture(event.pointerId);
});

cropSelection.addEventListener("pointermove", function(event) {

  if (!isDraggingCrop) return;

  const dx = event.clientX - startX;
  const dy = event.clientY - startY;

  cropSelection.style.left =
    (startLeft + dx) + "px";

  cropSelection.style.top =
    (startTop + dy) + "px";
});

cropSelection.addEventListener("pointerup", function() {

  isDraggingCrop = false;

});
</script>

</body>
</html>
