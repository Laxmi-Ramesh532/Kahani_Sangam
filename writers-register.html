<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahani Sansar - Writer Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f1e8;
            color: #333;
        }

        .header {
            text-align: center;
            padding: 25px 15px;
            background: #fffaf3;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin-top: 8px;
        }

        .box {
            max-width: 500px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .box h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: #8b5e3c;
            color:white;
            font-weight: bold;
        }
        button:hover {
            background: #6f472d;
        }   
        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Kahani Sansar</h1>
        <p>कहानियों की दुनिया में आपका स्वागत है</p>
    </div>

    <div class="box">
        <h2> लेखक बनें ✍️</h2>

        <form id="writerForm">
            <label>आपका नाम</label>
            <input type="text" name="fullName" placeholder="अपना नाम लिखें" required>

            <label>लेखक का नाम</label>
            <input type="text" name="penName" placeholder="जिस नाम से आप लिखना चाहते हैं" required>

            <label>ईमेल</label>
            <input type="email" placeholder="अपना email लिखें" required>

            <label>पासवर्ड</label>
            <input type="password" placeholder="Password बनाएँ" required>

            <label>अपने बारे में</label>
            <textarea placeholder="अपने लेखन, रूचियों और अपने बारे में थोड़ा लिखें" required></textarea>

            <button type="submit">Writer Account बनाएँ</button>
             <p id="confirmation" style="display:none; text-align:center; margin-top:20px;">
                 आपका Writer Account सफलतापूर्वक बनाया गया है। 🌸
             </p> 
        </form>

        <div class="back">
            <a href="index.html">← Home Page पर वापस जाएँ</a>
            </div>
        <div>
        <script>
        document.getElementById("writerForm").onsubmit = function(event) {
            event.preventDefault();
            document.getElementById("confirmation").style.display = "block";
        };
        </script>

</body>
</html>
