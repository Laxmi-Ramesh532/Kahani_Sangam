
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>लेखक बनें • कहानी संसार</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#ead8bd;
  color:#4b301c;
  font-family:Georgia,"Noto Serif Devanagari",serif;
}

header{
  background:#302219;
  color:#f8ead2;
  padding:16px 25px;
}

.header-inner{
  max-width:1000px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.back{
  color:#f8ead2;
  text-decoration:none;
  border:1px solid #c99b57;
  padding:8px 15px;
  border-radius:20px;
}

.container{
  max-width:850px;
  margin:40px auto;
  padding:0 18px;
}

.form-box{
  background:#f9efdf;
  padding:45px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  border:1px solid #d4b487;
}

.decor{
  text-align:center;
  font-size:30px;
  margin-bottom:10px;
}

h1{
  text-align:center;
  font-size:38px;
  margin:10px 0;
}

.intro{
  text-align:center;
  font-size:17px;
  line-height:1.8;
  margin-bottom:35px;
}

label{
  display:block;
  font-weight:bold;
  margin:18px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #cdb083;
  border-radius:9px;
  background:#fffaf1;
  color:#3f2b1d;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:300px;
  resize:vertical;
  line-height:1.9;
}
  .story-editor{
  width:100%;
  min-height:300px;
  padding:13px;
  border:1px solid #cdb083;
  border-radius:9px;
  background:#fffaf1;
  color:#3f2b1d;
  font-size:16px;
  font-family:inherit;
  line-height:1.9;
  outline:none;
  overflow-y:auto;
}

.story-editor:empty::before{
  content:attr(data-placeholder);
  color:#999;
}
  .crop-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.crop-box{
  background:#f9efdf;
  width:100%;
  max-width:500px;
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.crop-area{
  position:relative;
  display:inline-block;
  max-width:100%;
  overflow:hidden;
}

.crop-area img{
  display:block;
  max-width:100%;
  max-height:60vh;
}

#cropSelection{
  position:absolute;
  width:70%;
  aspect-ratio:1 / 1;
  left:15%;
  top:15%;
  border:2px solid white;
  box-shadow:0 0 0 9999px rgba(0,0,0,.45);
  cursor:move;
  touch-action:none;
}

.crop-buttons{
  margin-top:15px;
}

button{
  display:block;
  margin:30px auto 5px;
  padding:13px 30px;
  border:0;
  border-radius:25px;
  background:#4b301c;
  color:white;
  font-size:17px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#message{
  text-align:center;
  margin-top:20px;
  font-weight:bold;
}

.note{
  margin-top:25px;
  padding:15px;
  background:#f0dfc5;
  border-radius:10px;
  line-height:1.7;
  font-size:14px;
}

@media(max-width:600px){
  .form-box{
    padding:25px 18px;
  }

  h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">📖 कहानी संसार</div>
    <a class="back" href="index.html">← वापस</a>
  </div>
</header>

<main class="container">

  <section class="form-box">

    <div class="decor">🌸 🦋 🌸</div>

    <h1>✍️ अपनी कहानी लिखें</h1>

    <p class="intro">
      आपकी कहानी किसी पाठक की कल्पना को छू सकती है।
      अपनी मौलिक रचना यहाँ साझा करें और कहानी संसार का हिस्सा बनें।
    </p>

    <label for="author">लेखक का नाम</label>
    <input
      id="author"
      type="text"
      placeholder="अपना नाम लिखें"
    >

    <label for="title">कहानी का नाम</label>
    <input
      id="title"
      type="text"
      placeholder="अपनी कहानी का शीर्षक लिखें"
    >

    <label for="language">मूल भाषा</label>
    <select id="language">
      <option value="हिंदी">हिंदी</option>
      <option value="अवधी">अवधी</option>
      <option value="भोजपुरी">भोजपुरी</option>
      <option value="उर्दू">उर्दू</option>
      <option value="अन्य">अन्य</option>
    </select>
    
    <label for="age_category">कहानी किस उम्र के पाठकों के लिए है?</label>
    <select id="age_category">
      <option value="">उम्र चुनें</option>
      <option value="15 तक">15 वर्ष तक</option>
      <option value="16+">16 वर्ष और अधिक</option>
      
  </select>
    <label for="category">कहानी की श्रेणी चुनें</label>
<select id="category">
  <option value="">श्रेणी चुनें</option>
  <option value="कहानी">कहानी</option>
  <option value="लोककथा">लोककथा</option>
  <option value="लोकगीत">लोकगीत</option>
  <option value="रहस्यमयी कथा">रहस्यमयी कथा</option>
  <option value="प्रेरणादायक कहानी">प्रेरणादायक कहानी</option>
  <option value="ऐतिहासिक कथा">ऐतिहासिक कथा</option>
</select>

    <label for="episode_title">Episode 1 का नाम</label>
<input
  id="episode_title"
  type="text"
  placeholder="उदाहरण: देवगढ़ की सुनयना"
>

<label for="subtopics">Episode 1 के उप-विषय</label>
<textarea
  id="subtopics"
  placeholder="उदाहरण:
रहस्यमयी शुरुआत
देवगढ़ का जीवन
जंगल के पीछे की चमक"
></textarea>
    
    
    <label for="content">अपनी कहानी</label>

<div
  id="content"
  contenteditable="true"
  class="story-editor"
  data-placeholder="यहाँ अपनी पूरी कहानी लिखें..."
></div>

    
    <label for="storyImage">कहानी के लिए चित्र (वैकल्पिक)</label>
<input
  id="storyImage"
  type="file"
  accept="image/*"
>
      <div style="text-align:center; margin-top:10px;">
  <button type="button" onclick="changeImageSize('small')">
    छोटा
  </button>

  <button type="button" onclick="changeImageSize('medium')">
    मध्यम
  </button>

  <button type="button" onclick="changeImageSize('large')">
    बड़ा
  </button>
      </div>

    <button id="submitBtn" type="button" onclick="submitStory()">
      📖 कहानी प्रकाशित करें
    </button>

    <div id="message"></div>

    <div class="note">
      🌱 <strong>एक छोटी-सी बात:</strong>
      कृपया अपनी मौलिक रचना साझा करें या ऐसी रचना जिसके प्रकाशन की
      अनुमति आपके पास हो।
    </div>

  </section>

</main>
  <div id="cropModal" class="crop-modal">

  <div class="crop-box">

    <h3>✂️ चित्र काटें</h3>

    <div class="crop-area" id="cropArea">
      <img id="cropImage" src="" alt="Crop">
      <div id="cropSelection"></div>
    </div>

    <div class="crop-buttons">

      <button type="button" onclick="applyCrop()">
        ✅ ठीक है
      </button>

      <button type="button" onclick="closeCrop()">
        ❌ रद्द करें
      </button>

    </div>

  </div>

  </div>
```html




</body>
</html>
